<div class="flex flex-col gap-8">
  <div class="grid grid-cols-3 gap-8">
    @if (marketState.geckoGlobal.isLoading()) {
      @for (kpi of [0, 1, 2]; track $index) {
        <app-kpi-item-skeleton />
      }
    } @else {
      @for (kpi of kpis(); track $index) {
        <app-kpi-item [kpi]="kpi" />
      }
    }
  </div>

  <app-coin-table />
</div>
