<div class="bg-surface-container p-6 flex justify-between items-center">
  <div>
    <h2 class="text-2xl text-white font-semibold">Market Trends</h2>
  </div>
  <div class="flex gap-4">
    <button
      class="rounded-md border px-6 py-2 text-sm font-semibold transition hover:cursor-pointer"
      [class]="filterClass('gainers')"
      [attr.aria-pressed]="marketState.sort() === 'gainers'"
      (click)="marketState.changeTopGainers()">
      Top Gainers
    </button>

    <button
      class="rounded-md border px-6 py-2 text-sm font-semibold transition hover:cursor-pointer"
      [class]="filterClass('losers')"
      [attr.aria-pressed]="marketState.sort() === 'losers'"
      (click)="marketState.changeTopLosers()">
      Top Losers
    </button>

    <input
      type="text"
      name="coin-name-symbol"
      class="flex-1 min-w-0 rounded-md border border-outline-variant px-3 py-2 text-sm text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:outline-none transition-colors duration-100"
      placeholder="Filter coins..."
      autocomplete="off"
      (input)="setFilter($event)" />
  </div>
</div>
