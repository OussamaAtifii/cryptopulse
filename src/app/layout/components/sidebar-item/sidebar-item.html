<a
  [routerLink]="item().route"
  routerLinkActive="active"
  ariaCurrentWhenActive="page"
  class="flex h-11 items-center gap-3 rounded-md border-transparent px-3 font-inter text-sm font-medium text-on-surface-variant outline-none transition-colors duration-150 hover:bg-surface-container hover:text-on-surface focus-visible:bg-surface-container focus-visible:ring-2 focus-visible:ring-primary/30 [&.active]:border-s-primary [&.active]:bg-primary/10 [&.active]:text-primary">
  <!-- Icon -->
  <ng-container
    [ngComponentOutlet]="item().icon"
    [ngComponentOutletInputs]="{ class: 'size-5 shrink-0' }" />

  <!-- Title -->
  <span class="truncate">{{ item().title }}</span>
</a>
