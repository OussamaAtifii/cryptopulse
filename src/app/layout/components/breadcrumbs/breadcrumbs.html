<nav class="flex items-center justify-center gap-2 text-sm">
  @for (breadcrumb of breadcrumbState.breadcrumbs(); track breadcrumb.url) {
    @if (!$first) {
      <app-chevron-right class="size-3.5 text-outline" />
    }

    @if ($last) {
      <span class="font-medium text-on-surface capitalize">
        {{ breadcrumb.label }}
      </span>
    } @else {
      <a
        [routerLink]="breadcrumb.url"
        class="text-on-surface-variant capitalize transition-colors hover:text-primary">
        {{ breadcrumb.label }}
      </a>
    }
  }
</nav>
