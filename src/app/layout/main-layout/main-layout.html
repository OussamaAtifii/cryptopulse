<div class="flex w-full min-h-screen bg-surface">
  <app-sidebar
    [isOpen]="sidebarState.isOpen()"
    (navigate)="sidebarState.closeSidebar()" />

  @if (sidebarState.isOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 cursor-default bg-black/50 sm:hidden"
      aria-label="Cerrar menú de navegación"
      (click)="sidebarState.closeSidebar()"></button>
  }

  <main class="min-w-0 flex-1">
    <header
      class="flex items-center justify-between min-h-14 sm:min-h-16 px-4 sm:px-8 border-b border-outline-variant">
      <app-breadcrumbs />
      <button
        type="button"
        class="text-on-surface-variant p-2 rounded-md hover:bg-surface-container-low hover:text-on-surface transition-colors duration-200 hover:cursor-pointer sm:hidden"
        aria-label="Abrir menú de navegación"
        [attr.aria-expanded]="sidebarState.isOpen()"
        (click)="sidebarState.toggleSidebar()">
        <app-menu class="size-5" />
      </button>
    </header>
    <div class="p-4 sm:p-8">
      <router-outlet />
    </div>
  </main>
</div>
