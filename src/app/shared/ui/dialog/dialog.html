<dialog
  #dialog
  tabindex="-1"
  class="fixed inset-0 m-auto w-[96%] sm:w-full max-w-lg rounded-md border border-outline-variant bg-surface-container-low p-6 text-on-surface shadow-xl backdrop:bg-black/70"
  (cancel)="close()"
  (close)="dialogClosed()">
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold">
        <ng-content select="[modal-title]" />
      </h2>

      <p class="mt-1 text-sm text-on-surface-variant">
        <ng-content select="[modal-description]" />
      </p>
    </div>

    <button
      type="button"
      class="rounded-md p-2 text-on-surface-variant hover:cursor-pointer hover:bg-surface-container hover:text-on-surface"
      aria-label="Close modal"
      (click)="close()">
      <app-close />
    </button>
  </div>

  <div class="mt-6">
    <ng-content />
  </div>
</dialog>
